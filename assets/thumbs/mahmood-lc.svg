<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><style>
text{font-family:'Bricolage Grotesque','Segoe UI',Helvetica,Arial,sans-serif}
.fl{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 7s ease-in-out infinite -2s}.fl3{animation:fl 8s ease-in-out infinite -4s}
@keyframes fl{50%{transform:translateY(-8px)}}
.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{50%{opacity:.35}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 3.2s cubic-bezier(.2,.8,.2,1) infinite alternate}
@keyframes gr{from{transform:scaleY(.35)}}
.dash{stroke-dasharray:8 8;animation:da 1.2s linear infinite}@keyframes da{to{stroke-dashoffset:-16}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:dr 4s ease infinite}@keyframes dr{40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
.scan{animation:sc 2.6s ease-in-out infinite alternate}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(92px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 12s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.slide{animation:sl 5s ease-in-out infinite}@keyframes sl{0%,15%{transform:translateX(0)}45%,65%{transform:translateX(250px)}95%,100%{transform:translateX(0)}}
.pop{transform-box:fill-box;transform-origin:center;animation:po 3s ease-in-out infinite}@keyframes po{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="800" height="500" fill="#714B67"/><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.07)"/></pattern><rect width="800" height="500" fill="url(#g)"/><g class="fl"><rect x="70" y="70" width="270" height="350" rx="8" fill="#F3EEF2"/><text x="96" y="118" font-size="20" font-weight="700" fill="#1E1220" text-anchor="start" opacity="1">Letter of Credit</text><text x="96" y="140" font-size="12" font-weight="500" fill="#714B67" text-anchor="start" opacity="1">LC-2025-0418</text><rect x="96" y="170" width="210" height="8" rx="4" fill="#C29DB8" opacity="1"/><rect x="96" y="196" width="180" height="8" rx="4" fill="#C29DB8" opacity="1"/><rect x="96" y="222" width="200" height="8" rx="4" fill="#C29DB8" opacity="1"/><rect x="96" y="248" width="150" height="8" rx="4" fill="#C29DB8" opacity="1"/><rect x="96" y="274" width="190" height="8" rx="4" fill="#C29DB8" opacity="1"/><rect x="96" y="300" width="120" height="8" rx="4" fill="#C29DB8" opacity="1"/><circle cx="280" cy="365" r="34" fill="none" stroke="#714B67" stroke-width="3" stroke-dasharray="5 4" class="spin"/><text x="280" y="370" font-size="10" font-weight="800" fill="#714B67" text-anchor="middle" opacity="1">APPROVED</text></g><rect x="480" y="160" width="250" height="180" rx="16" fill="#1E1220"/><text x="605" y="238" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">Oracle</text><text x="605" y="266" font-size="26" font-weight="700" fill="#E9B949" text-anchor="middle" opacity="1">Fusion</text><path d="M340 215 H480" stroke="#E9B949" stroke-width="3" class="dash"/><path d="M480 285 H340" stroke="#FFFFFF" stroke-width="3" class="dash"/><text x="410" y="205" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">REST</text><circle r="6" fill="#E9B949"><animateMotion dur="1.8s" repeatCount="indefinite" path="M340 215 H480"/></circle><circle r="6" fill="#FFFFFF"><animateMotion dur="1.8s" repeatCount="indefinite" path="M480 285 H340"/></circle></svg>