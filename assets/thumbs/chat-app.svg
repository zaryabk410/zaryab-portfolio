<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><style>
text{font-family:'Bricolage Grotesque','Segoe UI',Helvetica,Arial,sans-serif}
.fl{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 7s ease-in-out infinite -2s}.fl3{animation:fl 8s ease-in-out infinite -4s}
@keyframes fl{50%{transform:translateY(-8px)}}
.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{50%{opacity:.35}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 3.2s cubic-bezier(.2,.8,.2,1) infinite alternate}
@keyframes gr{from{transform:scaleY(.35)}}
.dash{stroke-dasharray:8 8;animation:da 1.2s linear infinite}@keyframes da{to{stroke-dashoffset:-16}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:dr 4s ease infinite}@keyframes dr{40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
.scan{animation:sc 2.6s ease-in-out infinite alternate}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(92px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 12s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.slide{animation:sl 5s ease-in-out infinite}@keyframes sl{0%,15%{transform:translateX(0)}45%,65%{transform:translateX(250px)}95%,100%{transform:translateX(0)}}
.pop{transform-box:fill-box;transform-origin:center;animation:po 3s ease-in-out infinite}@keyframes po{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="800" height="500" fill="#714B67"/><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.07)"/></pattern><rect width="800" height="500" fill="url(#g)"/><g class="fl"><rect x="90" y="50" width="200" height="400" rx="28" fill="#1E1220"/><rect x="100" y="60" width="180" height="380" rx="20" fill="#F3EEF2"/><rect x="164.0" y="66" width="52" height="10" rx="5" fill="#1E1220"/><circle cx="130" cy="100" r="16" fill="#C29DB8"/><circle cx="130" cy="96.8" r="6.08" fill="#714B67"/><path d="M120.08 109.92a9.92 8.0 0 0 1 19.84 0" fill="#714B67"/><rect x="156" y="92" width="80" height="8" rx="4" fill="#1E1220" opacity="0.8"/><rect x="156" y="106" width="50" height="6" rx="4" fill="#C29DB8" opacity="1"/><rect x="120" y="150" width="110" height="34" rx="14" fill="#FFFFFF" class="pop" style="animation-delay:0.0s"/><rect x="132" y="163" width="70" height="8" rx="4" fill="#C29DB8" opacity="0.7"/><rect x="170" y="196" width="100" height="34" rx="14" fill="#714B67" class="pop" style="animation-delay:0.4s"/><rect x="182" y="209" width="60" height="8" rx="4" fill="#C29DB8" opacity="0.7"/><rect x="120" y="242" width="130" height="34" rx="14" fill="#FFFFFF" class="pop" style="animation-delay:0.8s"/><rect x="132" y="255" width="90" height="8" rx="4" fill="#C29DB8" opacity="0.7"/><rect x="160" y="288" width="110" height="34" rx="14" fill="#714B67" class="pop" style="animation-delay:1.2000000000000002s"/><rect x="172" y="301" width="70" height="8" rx="4" fill="#C29DB8" opacity="0.7"/><rect x="110" y="390" width="160" height="36" rx="18" fill="#FFFFFF" opacity="1"/></g><g transform="translate(360 90)"><g class="fl2"><rect width="190" height="120" rx="18" fill="#1E1220"/><rect x="18" y="18" width="70" height="84" rx="10" fill="#8E6485"/><circle cx="53" cy="58" r="24" fill="#C29DB8"/><circle cx="53" cy="53.2" r="9.120000000000001" fill="#714B67"/><path d="M38.120000000000005 72.88a14.879999999999999 12.0 0 0 1 29.759999999999998 0" fill="#714B67"/><rect x="100" y="18" width="70" height="84" rx="10" fill="#12838A"/><circle cx="135" cy="58" r="24" fill="#7CC6C9"/><circle cx="135" cy="53.2" r="9.120000000000001" fill="#1E1220"/><path d="M120.12 72.88a14.879999999999999 12.0 0 0 1 29.759999999999998 0" fill="#1E1220"/></g></g><g transform="translate(470 270)"><g class="fl3"><circle cx="0" cy="0" r="28" fill="none" stroke="#E9B949" stroke-width="5"/><circle cx="62" cy="0" r="28" fill="none" stroke="#FFFFFF" stroke-width="5"/><circle cx="124" cy="0" r="28" fill="none" stroke="#C29DB8" stroke-width="5"/><circle cx="186" cy="0" r="28" fill="none" stroke="#7CC6C9" stroke-width="5"/></g></g><text x="360" y="380" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1">Flutter + Firebase</text><text x="360" y="406" font-size="14" font-weight="500" fill="#C29DB8" text-anchor="start" opacity="1">Chat · Groups · Stories · Calls</text></svg>