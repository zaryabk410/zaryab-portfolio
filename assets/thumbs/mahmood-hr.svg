th="165" height="8" rx="4" fill="#714B67" class="grow" style="transform-origin:left;animation-name:gw;animation-delay:0.5s"/><circle cx="92" cy="320" r="16" fill="#C29DB8"/><circle cx="92" cy="316.8" r="6.08" fill="#714B67"/><path d="M82.08 329.92a9.92 8.0 0 0 1 19.84 0" fill="#714B67"/><rect x="122" y="310" width="140" height="9" rx="4" fill="#1E1220" opacity="0.75"/><rect x="122" y="326" width="300" height="8" rx="4" fill="#F3EEF2" opacity="1"/><rect x="122" y="326" width="240" height="8" rx="4" fill="#714B67" class="grow" style="transform-origin:left;animation-name:gw;animation-delay:0.75s"/><circle cx="92" cy="370" r="16" fill="#C29DB8"/><circle cx="92" cy="366.8" r="6.08" fill="#714B67"/><path d="M82.08 379.92a9.92 8.0 0 0 1 19.84 0" fill="#714B67"/><rect x="122" y="360" width="140" height="9" rx="4" fill="#1E1220" opacity="0.75"/><rect x="122" y="376" width="300" height="8" rx="4" fill="#F3EEF2" opacity="1"/><rect x="122" y="376" width="105" height="8" rx="4" fill="#714B67" class="grow" style="transform-origin:left;animation-name:gw;animation-delay:1.0s"/><g class="fl"><rect x="560" y="80" width="170" height="330" rx="28" fill="#1E1220"/><rect x="570" y="90" width="150" height="310" rx="20" fill="#F3EEF2"/><rect x="619.0" y="96" width="52" height="10" rx="5" fill="#1E1220"/><text x="645" y="140" font-size="14" font-weight="700" fill="#1E1220" text-anchor="middle" opacity="1">Leave request</text><rect x="590" y="160" width="110" height="40" rx="10" fill="#FFFFFF" opacity="1"/><rect x="600" y="172" width="70" height="8" rx="4" fill="#C29DB8" opacity="1"/><rect x="600" y="186" width="50" height="6" rx="4" fill="#F3EEF2" opacity="1"/><rect x="590" y="220" width="110" height="36" rx="18" fill="#12838A"/><text x="645" y="243" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">Approve</text><rect x="590" y="272" width="110" height="40" rx="10" fill="#FFFFFF" opacity="1"/><rect x="600" y="284" width="80" height="8" rx="4" fill="#C29DB8" opacity="1"/></g></svg>