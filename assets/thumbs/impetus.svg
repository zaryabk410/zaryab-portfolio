<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><style>
text{font-family:'Bricolage Grotesque','Segoe UI',Helvetica,Arial,sans-serif}
.fl{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 7s ease-in-out infinite -2s}.fl3{animation:fl 8s ease-in-out infinite -4s}
@keyframes fl{50%{transform:translateY(-8px)}}
.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{50%{opacity:.35}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 3.2s cubic-bezier(.2,.8,.2,1) infinite alternate}
@keyframes gr{from{transform:scaleY(.35)}}
.dash{stroke-dasharray:8 8;animation:da 1.2s linear infinite}@keyframes da{to{stroke-dashoffset:-16}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:dr 4s ease infinite}@keyframes dr{40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
.scan{animation:sc 2.6s ease-in-out infinite alternate}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(92px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 12s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.slide{animation:sl 5s ease-in-out infinite}@keyframes sl{0%,15%{transform:translateX(0)}45%,65%{transform:translateX(250px)}95%,100%{transform:translateX(0)}}
.pop{transform-box:fill-box;transform-origin:center;animation:po 3s ease-in-out infinite}@keyframes po{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
