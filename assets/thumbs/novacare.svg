<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><style>
text{font-family:'Bricolage Grotesque','Segoe UI',Helvetica,Arial,sans-serif}
.fl{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 7s ease-in-out infinite -2s}.fl3{animation:fl 8s ease-in-out infinite -4s}
@keyframes fl{50%{transform:translateY(-8px)}}
.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{50%{opacity:.35}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 3.2s cubic-bezier(.2,.8,.2,1) infinite alternate}
@keyframes gr{from{transform:scaleY(.35)}}
.dash{stroke-dasharray:8 8;animation:da 1.2s linear infinite}@keyframes da{to{stroke-dashoffset:-16}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:dr 4s ease infinite}@keyframes dr{40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
.scan{animation:sc 2.6s ease-in-out infinite alternate}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(92px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 12s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.slide{animation:sl 5s ease-in-out infinite}@keyframes sl{0%,15%{transform:translateX(0)}45%,65%{transform:translateX(250px)}95%,100%{transform:translateX(0)}}
.pop{transform-box:fill-box;transform-origin:center;animation:po 3s ease-in-out infinite}@keyframes po{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="800" height="500" fill="#7CC6C9"/><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(30,18,32,.07)"/></pattern><rect width="800" height="500" fill="url(#g)"/><g class="fl"><rect x="90" y="70" width="190" height="360" rx="28" fill="#1E1220"/><rect x="100" y="80" width="170" height="340" rx="20" fill="#F3EEF2"/><rect x="159.0" y="86" width="52" height="10" rx="5" fill="#1E1220"/><rect x="120" y="120" width="130" height="86" rx="8" fill="#FFFFFF" stroke="#12838A" stroke-width="2"/><circle cx="150" cy="160" r="18" fill="#C29DB8"/><circle cx="150" cy="156.4" r="6.84" fill="#714B67"/><path d="M138.84 171.16a11.16 9.0 0 0 1 22.32 0" fill="#714B67"/><rect x="178" y="142" width="58" height="6" rx="4" fill="#C29DB8" opacity="1"/><rect x="178" y="156" width="44" height="6" rx="4" fill="#C29DB8" opacity="1"/><rect x="178" y="170" width="50" height="6" rx="4" fill="#C29DB8" opacity="1"/><rect x="114" y="116" width="142" height="4" fill="#E9B949" class="scan"/><text x="185" y="240" font-size="13" font-weight="700" fill="#12838A" text-anchor="middle" opacity="1">CNIC scanned</text><rect x="120" y="360" width="130" height="36" rx="18" fill="#714B67"/><text x="185" y="383" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">Check in</text></g><rect x="360" y="90" width="360" height="320" rx="18" fill="#FFFFFF"/><rect x="386" y="116" width="44" height="44" rx="10" fill="#12838A"/><path d="M408 126v24M396 138h24" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="446" y="146" font-size="20" font-weight="700" fill="#1E1220" text-anchor="start" opacity="1">Novacare HR</text><rect x="386" y="260" width="52" height="70" rx="6" fill="#C29DB8" class="grow" style="animation-delay:0.0s"/><rect x="466" y="220" width="52" height="110" rx="6" fill="#714B67" class="grow" style="animation-delay:0.2s"/><rect x="546" y="240" width="52" height="90" rx="6" fill="#7CC6C9" class="grow" style="animation-delay:0.4s"/><rect x="626" y="190" width="52" height="140" rx="6" fill="#12838A" class="grow" style="animation-delay:0.6000000000000001s"/><rect x="386" y="350" width="310" height="2" rx="4" fill="#F3EEF2" opacity="1"/><text x="386" y="390" font-size="12" font-weight="500" fill="#714B67" text-anchor="start" opacity="1">Visitors this week</text></svg>