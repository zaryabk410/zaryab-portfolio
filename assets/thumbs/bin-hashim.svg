<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><style>
text{font-family:'Bricolage Grotesque','Segoe UI',Helvetica,Arial,sans-serif}
.fl{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 7s ease-in-out infinite -2s}.fl3{animation:fl 8s ease-in-out infinite -4s}
@keyframes fl{50%{transform:translateY(-8px)}}
.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{50%{opacity:.35}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 3.2s cubic-bezier(.2,.8,.2,1) infinite alternate}
@keyframes gr{from{transform:scaleY(.35)}}
.dash{stroke-dasharray:8 8;animation:da 1.2s linear infinite}@keyframes da{to{stroke-dashoffset:-16}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:dr 4s ease infinite}@keyframes dr{40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
.scan{animation:sc 2.6s ease-in-out infinite alternate}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(92px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 12s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.slide{animation:sl 5s ease-in-out infinite}@keyframes sl{0%,15%{transform:translateX(0)}45%,65%{transform:translateX(250px)}95%,100%{transform:translateX(0)}}
.pop{transform-box:fill-box;transform-origin:center;animation:po 3s ease-in-out infinite}@keyframes po{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="800" height="500" fill="#1E1220"/><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.07)"/></pattern><rect width="800" height="500" fill="url(#g)"/><rect x="0" y="360" width="800" height="16" fill="#714B67"/><g class="dash"><line x1="0" y1="368" x2="800" y2="368" stroke="#E9B949" stroke-width="3" class="dash"/></g><g class="slide"><g transform="translate(60 0)"><path d="M0 300l50-22 50 22v58l-50 22-50-22z" fill="#E9B949"/><path d="M0 300l50 22 50-22" fill="none" stroke="#1E1220" stroke-width="2" opacity=".4"/><path d="M50 322v58" stroke="#1E1220" stroke-width="2" opacity=".4"/></g><g transform="translate(200 0)"><path d="M0 300l50-22 50 22v58l-50 22-50-22z" fill="#E9B949"/><path d="M0 300l50 22 50-22" fill="none" stroke="#1E1220" stroke-width="2" opacity=".4"/><path d="M50 322v58" stroke="#1E1220" stroke-width="2" opacity=".4"/></g><g transform="translate(340 0)"><path d="M0 300l50-22 50 22v58l-50 22-50-22z" fill="#E9B949"/><path d="M0 300l50 22 50-22" fill="none" stroke="#1E1220" stroke-width="2" opacity=".4"/><path d="M50 322v58" stroke="#1E1220" stroke-width="2" opacity=".4"/></g></g><rect x="470" y="50" width="290" height="250" rx="14" fill="#FFFFFF"/><path d="M470 64a14 14 0 0 1 14-14h262a14 14 0 0 1 14 14v16h-290z" fill="#F3EEF2"/><circle cx="488" cy="66" r="4" fill="#714B67"/><circle cx="502" cy="66" r="4" fill="#C29DB8"/><circle cx="516" cy="66" r="4" fill="#E9B949"/><text x="492" y="118" font-size="16" font-weight="700" fill="#1E1220" text-anchor="start" opacity="1">Order #BH-2291</text><circle cx="502" cy="146" r="10" fill="#12838A"/><path d="M497.5 146l3.0 3.2 6.0-6.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="522" y="151" font-size="13" font-weight="500" fill="#1E1220" text-anchor="start" opacity="1">Confirmed</text><line x1="502" y1="158" x2="502" y2="170" stroke="#C29DB8" stroke-width="2"/><circle cx="502" cy="182" r="10" fill="#12838A"/><path d="M497.5 182l3.0 3.2 6.0-6.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="522" y="187" font-size="13" font-weight="500" fill="#1E1220" text-anchor="start" opacity="1">In production</text><line x1="502" y1="194" x2="502" y2="206" stroke="#C29DB8" stroke-width="2"/><circle cx="502" cy="218" r="10" fill="none" stroke="#C29DB8" stroke-width="3" class="pulse"/><text x="522" y="223" font-size="13" font-weight="500" fill="#8E6485" text-anchor="start" opacity="1">Quality check</text><line x1="502" y1="230" x2="502" y2="242" stroke="#C29DB8" stroke-width="2"/><circle cx="502" cy="254" r="10" fill="none" stroke="#C29DB8" stroke-width="3" class=""/><text x="522" y="259" font-size="13" font-weight="500" fill="#8E6485" text-anchor="start" opacity="1">Delivered</text><text x="60" y="110" font-size="64" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="0.95">MRP</text><text x="60" y="150" font-size="16" font-weight="500" fill="#C29DB8" text-anchor="start" opacity="1">Sales · Purchase · Inventory</text></svg>