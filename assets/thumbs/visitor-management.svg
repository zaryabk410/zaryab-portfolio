<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><style>
text{font-family:'Bricolage Grotesque','Segoe UI',Helvetica,Arial,sans-serif}
.fl{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 7s ease-in-out infinite -2s}.fl3{animation:fl 8s ease-in-out infinite -4s}
@keyframes fl{50%{transform:translateY(-8px)}}
.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{50%{opacity:.35}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 3.2s cubic-bezier(.2,.8,.2,1) infinite alternate}
@keyframes gr{from{transform:scaleY(.35)}}
.dash{stroke-dasharray:8 8;animation:da 1.2s linear infinite}@keyframes da{to{stroke-dashoffset:-16}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:dr 4s ease infinite}@keyframes dr{40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
.scan{animation:sc 2.6s ease-in-out infinite alternate}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(92px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 12s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.slide{animation:sl 5s ease-in-out infinite}@keyframes sl{0%,15%{transform:translateX(0)}45%,65%{transform:translateX(250px)}95%,100%{transform:translateX(0)}}
.pop{transform-box:fill-box;transform-origin:center;animation:po 3s ease-in-out infinite}@keyframes po{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes sc2{from{transform:translateY(0)}to{transform:translateY(76px)}}</style><rect width="800" height="500" fill="#12838A"/><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.07)"/></pattern><rect width="800" height="500" fill="url(#g)"/><g class="fl"><rect x="300" y="50" width="200" height="400" rx="28" fill="#140B15"/><rect x="310" y="60" width="180" height="380" rx="20" fill="#1E1220"/><rect x="374.0" y="66" width="52" height="10" rx="5" fill="#140B15"/><rect x="340" y="140" width="120" height="80" rx="8" fill="none" stroke="#E9B949" stroke-width="3" stroke-dasharray="20 60 20 0"/><circle cx="378" cy="180" r="20" fill="#C29DB8"/><circle cx="378" cy="176.0" r="7.6" fill="#714B67"/><path d="M365.6 192.4a12.4 10.0 0 0 1 24.8 0" fill="#714B67"/><rect x="406" y="166" width="40" height="6" rx="4" fill="#F3EEF2" opacity="1"/><rect x="406" y="180" width="30" height="6" rx="4" fill="#F3EEF2" opacity="0.6"/><rect x="336" y="140" width="128" height="3" fill="#E9B949" class="scan" style="animation-name:sc2"/><text x="400" y="262" font-size="13" font-weight="700" fill="#E9B949" text-anchor="middle" opacity="1">Scanning CNIC</text><rect x="330" y="290" width="140" height="44" rx="12" fill="#714B67" opacity="1"/><text x="400" y="318" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">Ali Hassan</text><rect x="330" y="350" width="140" height="40" rx="20" fill="#12838A"/><text x="400" y="376" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">Check in</text></g><g class="fl2"><rect x="560" y="110" width="190" height="150" rx="14" fill="#FFFFFF"/><path d="M560 124a14 14 0 0 1 14-14h162a14 14 0 0 1 14 14v16h-190z" fill="#F3EEF2"/><circle cx="578" cy="126" r="4" fill="#714B67"/><circle cx="592" cy="126" r="4" fill="#C29DB8"/><circle cx="606" cy="126" r="4" fill="#E9B949"/><text x="578" y="168" font-size="13" font-weight="600" fill="#714B67" text-anchor="start" opacity="1">Today</text><text x="578" y="210" font-size="40" font-weight="800" fill="#1E1220" text-anchor="start" opacity="1">42</text><text x="640" y="210" font-size="12" font-weight="500" fill="#714B67" text-anchor="start" opacity="1">visitors</text></g><g class="fl3"><rect x="50" y="230" width="200" height="160" rx="14" fill="#FFFFFF"/><path d="M50 244a14 14 0 0 1 14-14h172a14 14 0 0 1 14 14v16h-200z" fill="#F3EEF2"/><circle cx="68" cy="246" r="4" fill="#714B67"/><circle cx="82" cy="246" r="4" fill="#C29DB8"/><circle cx="96" cy="246" r="4" fill="#E9B949"/><rect x="74" y="340" width="20" height="30" rx="4" fill="#714B67" class="grow" style="animation-delay:0.0s"/><rect x="104" y="310" width="20" height="60" rx="4" fill="#714B67" class="grow" style="animation-delay:0.15s"/><rect x="134" y="325" width="20" height="45" rx="4" fill="#714B67" class="grow" style="animation-delay:0.3s"/><rect x="164" y="290" width="20" height="80" rx="4" fill="#714B67" class="grow" style="animation-delay:0.44999999999999996s"/><rect x="194" y="315" width="20" height="55" rx="4" fill="#714B67" class="grow" style="animation-delay:0.6s"/></g></svg>