<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><style>
text{font-family:'Bricolage Grotesque','Segoe UI',Helvetica,Arial,sans-serif}
.fl{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 7s ease-in-out infinite -2s}.fl3{animation:fl 8s ease-in-out infinite -4s}
@keyframes fl{50%{transform:translateY(-8px)}}
.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{50%{opacity:.35}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 3.2s cubic-bezier(.2,.8,.2,1) infinite alternate}
@keyframes gr{from{transform:scaleY(.35)}}
.dash{stroke-dasharray:8 8;animation:da 1.2s linear infinite}@keyframes da{to{stroke-dashoffset:-16}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:dr 4s ease infinite}@keyframes dr{40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
.scan{animation:sc 2.6s ease-in-out infinite alternate}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(92px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 12s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.slide{animation:sl 5s ease-in-out infinite}@keyframes sl{0%,15%{transform:translateX(0)}45%,65%{transform:translateX(250px)}95%,100%{transform:translateX(0)}}
.pop{transform-box:fill-box;transform-origin:center;animation:po 3s ease-in-out infinite}@keyframes po{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="800" height="500" fill="#8E6485"/><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.07)"/></pattern><rect width="800" height="500" fill="url(#g)"/><g class="fl"><rect x="70" y="120" width="160" height="230" rx="14" fill="#FFFFFF"/><rect x="84" y="134" width="132" height="110" rx="10" fill="#C29DB8"/><circle cx="150" cy="189" r="24" fill="#FFFFFF" opacity=".6"/><rect x="84" y="262" width="110" height="10" rx="4" fill="#1E1220" opacity="0.8"/><rect x="84" y="282" width="70" height="8" rx="4" fill="#C29DB8" opacity="1"/><text x="84" y="330" font-size="16" font-weight="700" fill="#714B67" text-anchor="start" opacity="1">SAR 149</text></g><g class="fl2"><rect x="250" y="120" width="160" height="230" rx="14" fill="#FFFFFF"/><rect x="264" y="134" width="132" height="110" rx="10" fill="#E9B949"/><circle cx="330" cy="189" r="28" fill="#FFFFFF" opacity=".6"/><rect x="264" y="262" width="110" height="10" rx="4" fill="#1E1220" opacity="0.8"/><rect x="264" y="282" width="70" height="8" rx="4" fill="#C29DB8" opacity="1"/><text x="264" y="330" font-size="16" font-weight="700" fill="#714B67" text-anchor="start" opacity="1">SAR 89</text></g><g class="fl3"><rect x="430" y="120" width="160" height="230" rx="14" fill="#FFFFFF"/><rect x="444" y="134" width="132" height="110" rx="10" fill="#7CC6C9"/><circle cx="510" cy="189" r="32" fill="#FFFFFF" opacity=".6"/><rect x="444" y="262" width="110" height="10" rx="4" fill="#1E1220" opacity="0.8"/><rect x="444" y="282" width="70" height="8" rx="4" fill="#C29DB8" opacity="1"/><text x="444" y="330" font-size="16" font-weight="700" fill="#714B67" text-anchor="start" opacity="1">SAR 240</text></g><g transform="translate(640 240)"><g class="pop"><circle r="70" fill="#E9B949"/><path d="M-32 -20h12l10 40h36l10-28h-52" fill="none" stroke="#1E1220" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-4" cy="32" r="6" fill="#1E1220"/><circle cx="22" cy="32" r="6" fill="#1E1220"/></g></g><circle cx="690" cy="185" r="18" fill="#714B67"/><text x="690" y="191" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="1">3</text><text x="70" y="86" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1">Orders synced to Odoo</text></svg>