<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><style>
text{font-family:'Bricolage Grotesque','Segoe UI',Helvetica,Arial,sans-serif}
.fl{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 7s ease-in-out infinite -2s}.fl3{animation:fl 8s ease-in-out infinite -4s}
@keyframes fl{50%{transform:translateY(-8px)}}
.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{50%{opacity:.35}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 3.2s cubic-bezier(.2,.8,.2,1) infinite alternate}
@keyframes gr{from{transform:scaleY(.35)}}
.dash{stroke-dasharray:8 8;animation:da 1.2s linear infinite}@keyframes da{to{stroke-dashoffset:-16}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:dr 4s ease infinite}@keyframes dr{40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
.scan{animation:sc 2.6s ease-in-out infinite alternate}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(92px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 12s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.slide{animation:sl 5s ease-in-out infinite}@keyframes sl{0%,15%{transform:translateX(0)}45%,65%{transform:translateX(250px)}95%,100%{transform:translateX(0)}}
.pop{transform-box:fill-box;transform-origin:center;animation:po 3s ease-in-out infinite}@keyframes po{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="800" height="500" fill="#E9B949"/><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(30,18,32,.08)"/></pattern><rect width="800" height="500" fill="url(#g)"/><g class="fl"><rect x="90" y="60" width="320" height="380" rx="10" fill="#FFFFFF"/><rect x="90" y="60" width="320" height="70" rx="10" fill="#714B67"/><text x="116" y="104" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1">Offer letter</text><rect x="116" y="160" width="260" height="8" rx="4" fill="#F3EEF2" opacity="1"/><rect x="116" y="184" width="230" height="8" rx="4" fill="#F3EEF2" opacity="1"/><rect x="116" y="208" width="250" height="8" rx="4" fill="#F3EEF2" opacity="1"/><rect x="116" y="232" width="190" height="8" rx="4" fill="#F3EEF2" opacity="1"/><rect x="116" y="256" width="240" height="8" rx="4" fill="#F3EEF2" opacity="1"/><rect x="116" y="280" width="160" height="8" rx="4" fill="#F3EEF2" opacity="1"/><rect x="116" y="330" width="120" height="44" rx="22" fill="#12838A"/><text x="176" y="358" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">Accept</text><rect x="250" y="330" width="120" height="44" rx="22" fill="none" stroke="#C29DB8" stroke-width="2"/><text x="310" y="358" font-size="15" font-weight="700" fill="#714B67" text-anchor="middle" opacity="1">Decline</text></g><g transform="translate(590 250)"><circle cx="0" cy="-40" r="60" fill="#F3EEF2"/><circle cx="0" cy="-52.0" r="22.8" fill="#714B67"/><path d="M-37.2 -2.799999999999997a37.2 30.0 0 0 1 74.4 0" fill="#714B67"/><text x="0" y="60" font-size="18" font-weight="700" fill="#1E1220" text-anchor="middle" opacity="1">Candidate</text><g transform="translate(48 -86)"><g class="pop"><circle cx="0" cy="0" r="22" fill="#12838A"/><path d="M-9.9 0l6.6 7.04 13.2-13.64" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><path d="M410 240 C 470 200 500 220 520 210" fill="none" stroke="#1E1220" stroke-width="3" class="dash"/></svg>