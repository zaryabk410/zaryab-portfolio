<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><style>
text{font-family:'Bricolage Grotesque','Segoe UI',Helvetica,Arial,sans-serif}
.fl{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 7s ease-in-out infinite -2s}.fl3{animation:fl 8s ease-in-out infinite -4s}
@keyframes fl{50%{transform:translateY(-8px)}}
.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{50%{opacity:.35}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 3.2s cubic-bezier(.2,.8,.2,1) infinite alternate}
@keyframes gr{from{transform:scaleY(.35)}}
.dash{stroke-dasharray:8 8;animation:da 1.2s linear infinite}@keyframes da{to{stroke-dashoffset:-16}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:dr 4s ease infinite}@keyframes dr{40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
.scan{animation:sc 2.6s ease-in-out infinite alternate}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(92px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 12s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.slide{animation:sl 5s ease-in-out infinite}@keyframes sl{0%,15%{transform:translateX(0)}45%,65%{transform:translateX(250px)}95%,100%{transform:translateX(0)}}
.pop{transform-box:fill-box;transform-origin:center;animation:po 3s ease-in-out infinite}@keyframes po{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="800" height="500" fill="#714B67"/><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.07)"/></pattern><rect width="800" height="500" fill="url(#g)"/><g class="fl"><rect x="80" y="60" width="300" height="380" rx="10" fill="#FFFFFF"/><text x="106" y="110" font-size="22" font-weight="700" fill="#1E1220" text-anchor="start" opacity="1">Report card</text><rect x="106" y="124" width="120" height="8" rx="4" fill="#C29DB8" opacity="1"/><text x="106" y="176" font-size="14" font-weight="500" fill="#1E1220" text-anchor="start" opacity="1">Mathematics</text><text x="350" y="176" font-size="16" font-weight="800" fill="#714B67" text-anchor="end" opacity="1">A</text><rect x="106" y="190" width="244" height="1" rx="4" fill="#F3EEF2" opacity="1"/><text x="106" y="220" font-size="14" font-weight="500" fill="#1E1220" text-anchor="start" opacity="1">Physics</text><text x="350" y="220" font-size="16" font-weight="800" fill="#714B67" text-anchor="end" opacity="1">A-</text><rect x="106" y="234" width="244" height="1" rx="4" fill="#F3EEF2" opacity="1"/><text x="106" y="264" font-size="14" font-weight="500" fill="#1E1220" text-anchor="start" opacity="1">English</text><text x="350" y="264" font-size="16" font-weight="800" fill="#714B67" text-anchor="end" opacity="1">B+</text><rect x="106" y="278" width="244" height="1" rx="4" fill="#F3EEF2" opacity="1"/><text x="106" y="308" font-size="14" font-weight="500" fill="#1E1220" text-anchor="start" opacity="1">Computer</text><text x="350" y="308" font-size="16" font-weight="800" fill="#714B67" text-anchor="end" opacity="1">A+</text><rect x="106" y="322" width="244" height="1" rx="4" fill="#F3EEF2" opacity="1"/><text x="106" y="352" font-size="14" font-weight="500" fill="#1E1220" text-anchor="start" opacity="1">Attendance</text><text x="350" y="352" font-size="16" font-weight="800" fill="#714B67" text-anchor="end" opacity="1">96%</text><rect x="106" y="366" width="244" height="1" rx="4" fill="#F3EEF2" opacity="1"/></g><g transform="translate(560 200)"><circle r="90" fill="none" stroke="#8E6485" stroke-width="18"/><circle r="90" fill="none" stroke="#E9B949" stroke-width="18" stroke-dasharray="497 600" transform="rotate(-90)" stroke-linecap="round" class="pulse"/><text x="0" y="14" font-size="40" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="1">88%</text></g><g transform="translate(470 340)"><g class="fl2"><rect width="190" height="100" rx="10" fill="#E9B949"/><path d="M0 8l95 50 95-50" fill="none" stroke="#1E1220" stroke-width="3"/><text x="95" y="88" font-size="13" font-weight="700" fill="#1E1220" text-anchor="middle" opacity="1">Sent to parents</text></g></g></svg>