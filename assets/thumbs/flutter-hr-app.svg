<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><style>
text{font-family:'Bricolage Grotesque','Segoe UI',Helvetica,Arial,sans-serif}
.fl{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 7s ease-in-out infinite -2s}.fl3{animation:fl 8s ease-in-out infinite -4s}
@keyframes fl{50%{transform:translateY(-8px)}}
.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{50%{opacity:.35}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 3.2s cubic-bezier(.2,.8,.2,1) infinite alternate}
@keyframes gr{from{transform:scaleY(.35)}}
.dash{stroke-dasharray:8 8;animation:da 1.2s linear infinite}@keyframes da{to{stroke-dashoffset:-16}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:dr 4s ease infinite}@keyframes dr{40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-600}}
.scan{animation:sc 2.6s ease-in-out infinite alternate}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(92px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 12s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.slide{animation:sl 5s ease-in-out infinite}@keyframes sl{0%,15%{transform:translateX(0)}45%,65%{transform:translateX(250px)}95%,100%{transform:translateX(0)}}
.pop{transform-box:fill-box;transform-origin:center;animation:po 3s ease-in-out infinite}@keyframes po{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="800" height="500" fill="#C29DB8"/><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(30,18,32,.07)"/></pattern><rect width="800" height="500" fill="url(#g)"/><g class="fl"><rect x="120" y="60" width="200" height="380" rx="28" fill="#1E1220"/><rect x="130" y="70" width="180" height="360" rx="20" fill="#F3EEF2"/><rect x="194.0" y="76" width="52" height="10" rx="5" fill="#1E1220"/><text x="220" y="130" font-size="14" font-weight="500" fill="#714B67" text-anchor="middle" opacity="1">Good morning</text><text x="220" y="160" font-size="36" font-weight="800" fill="#1E1220" text-anchor="middle" opacity="1">09:02</text><circle cx="220" cy="250" r="56" fill="#714B67" class="pop"/><path d="M205 250l12 12 22-24" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="340" font-size="14" font-weight="700" fill="#12838A" text-anchor="middle" opacity="1">Checked in</text><rect x="160" y="370" width="120" height="34" rx="12" fill="#FFFFFF" opacity="1"/></g><g transform="translate(560 250)"><rect x="-120" y="-110" width="240" height="220" rx="24" fill="#1E1220"/><text x="0" y="-60" font-size="16" font-weight="600" fill="#C29DB8" text-anchor="middle" opacity="1">Odoo licenses</text><text x="0" y="10" font-size="72" font-weight="800" fill="#E9B949" text-anchor="middle" opacity="1">0</text><text x="0" y="56" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle" opacity="1">needed for staff</text></g><path d="M320 250 H440" stroke="#1E1220" stroke-width="3" class="dash"/></svg>